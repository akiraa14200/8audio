name: Restore full ArchiveTune codebase as 8 Audio

on:
  workflow_dispatch:
  push:
    branches: ["rebuild/native-8audio-from-scratch"]
    paths: [".github/workflows/restore-archivetune.yml"]

permissions:
  contents: write

jobs:
  restore-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 8 Audio working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Checkout original ArchiveTune 13.2.0 source
        uses: actions/checkout@v4
        with:
          repository: koiverse/ArchiveTune
          ref: v13.2.0
          path: archivetune-source
          fetch-depth: 1

      - name: Restore complete original project and apply 8 Audio branding
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='archivetune-source/' \
            --exclude='.github/workflows/' \
            archivetune-source/ ./
          rm -f .gitmodules
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          gradle = root / "app/build.gradle.kts"
          content = gradle.read_text()
          content = content.replace('applicationId = "moe.koiverse.archivetune"', 'applicationId = "com.akiraa14200.eightaudio"')
          gradle.write_text(content)

          settings = root / "settings.gradle.kts"
          settings.write_text(settings.read_text().replace('rootProject.name = "ArchiveTune"', 'rootProject.name = "8 Audio"'))

          for path in (root / "app/src/main/res").glob("values*/strings.xml"):
              text = path.read_text(errors="ignore")
              text = text.replace("ArchiveTune", "8 Audio")
              path.write_text(text)

          app_name = root / "app/src/main/res/values/app_name.xml"
          if app_name.exists():
              text = app_name.read_text().replace(">ArchiveTune<", ">8 Audio<")
              app_name.write_text(text)

          readme = root / "README.md"
          if readme.exists():
              text = readme.read_text()
              text = re.sub(r"(?m)^#\s*ArchiveTune\b", "# 8 Audio", text, count=1)
              text = text.replace("ArchiveTune", "8 Audio")
              readme.write_text(text)

          # Avoid carrying the original project's signing keystores into this repository.
          for p in [root / "Koiverse.jks", root / "Koiverse.jks.base64",
                    root / "app/Koiverse.jks", root / "app/persistent-debug.keystore"]:
              if p.exists():
                  p.unlink()
          PY

          cat > app/src/main/res/drawable/ic_8audio.xml <<'XML'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp" android:height="48dp"
              android:viewportWidth="48" android:viewportHeight="48">
              <path android:fillColor="#101512" android:pathData="M0,0h48v48h-48z"/>
              <path android:fillColor="#B8F7D4" android:pathData="M24,6C14.06,6 6,14.06 6,24v8c0,3.31 2.69,6 6,6h3V22h-3c-0.7,0 -1.37,0.12 -2,0.34V24C10,16.28 16.28,10 24,10s14,6.28 14,14v-1.66c-0.63,-0.22 -1.3,-0.34 -2,-0.34h-3v16h3c3.31,0 6,-2.69 6,-6v-8C42,14.06 33.94,6 24,6z"/>
              <path android:fillColor="#B8F7D4" android:pathData="M19,19h10v4h-10zM19,26h10v4h-10z"/>
          </vector>
          XML
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:icon="@mipmap/ic_launcher"', 'android:icon="@drawable/ic_8audio"')
          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Restore full ArchiveTune 13.2.0 project as 8 Audio"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build full native app
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleMobileUniversalDebug
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}

      - name: Verify APK
        run: test -s app/build/outputs/apk/mobile/universal/debug/app-mobile-universal-debug.apk

      - name: Upload 8 Audio APK
        uses: actions/upload-artifact@v4
        with:
          name: 8-audio-archive-tune-debug
          path: app/build/outputs/apk/mobile/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 14
