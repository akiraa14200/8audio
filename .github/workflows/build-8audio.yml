name: Build 8 Audio APK

on:
  workflow_dispatch:
  push:
    branches: [main, "rebuild/**"]
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", "gradle.properties", "gradle/**", ".github/workflows/build-8audio.yml"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build ArchiveTune-based 8 Audio
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleMobileUniversalDebug
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
      - name: Verify APK
        run: test -s app/build/outputs/apk/mobile/universal/debug/app-mobile-universal-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: 8-audio-debug-apk
          path: app/build/outputs/apk/mobile/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 14
