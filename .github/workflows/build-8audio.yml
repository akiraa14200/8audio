name: Build 8 Audio APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-8audio.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 8 Audio build configuration
        uses: actions/checkout@v4

      - name: Checkout ArchiveTune source and required submodules
        uses: actions/checkout@v4
        with:
          repository: rukamori/ArchiveTune
          ref: main
          path: upstream
          submodules: recursive
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: upstream/gradle/libs.versions.toml

      - name: Brand application as 8 Audio
        shell: bash
        run: |
          set -euo pipefail
          cd upstream
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s, count = re.subn(
              r'(?m)^(\s*applicationId\s*=\s*)"[^"]+"',
              r'\1"com.akiraa14200.eightaudio"',
              s,
              count=1,
          )
          if count != 1:
              raise SystemExit("Could not locate applicationId in app/build.gradle.kts")
          # Keep upstream namespace unchanged so Kotlin R/BuildConfig references remain valid.
          p.write_text(s)

          manifest = Path("app/src/main/AndroidManifest.xml")
          if manifest.exists():
              s = manifest.read_text()
              s = s.replace('android:label="@string/app_name"', 'android:label="8 Audio"')
              manifest.write_text(s)

          for strings_file in Path("app/src").rglob("strings.xml"):
              s = strings_file.read_text(errors="ignore")
              s = s.replace(">ArchiveTune<", ">8 Audio<").replace(">Archive Tune<", ">8 Audio<")
              strings_file.write_text(s)
          PY
          chmod +x gradlew

      - name: Verify required Gradle project directories
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          test -d core
          test -d lyrics/betterlyrics
          test -f gradlew
          echo "Required source modules are present."

      - name: Build arm64 debug APK
        working-directory: upstream
        run: ./gradlew --no-daemon :app:assembleFossMobileArm64Debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 8-audio-arm64-debug
          path: upstream/app/build/outputs/apk/foss/mobile/arm64/debug/*.apk
          if-no-files-found: error
          retention-days: 14
