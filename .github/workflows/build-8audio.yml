name: Build 8 Audio APK

on:
  workflow_dispatch:
  push:
    branches: [main, "rebuild/**", "enhance/**"]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/build-8audio.yml"

permissions:
  contents: read

concurrency:
  group: 8-audio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout 8 Audio source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify source tree
        shell: bash
        run: |
          set -euo pipefail
          test -f ./gradlew
          test -f settings.gradle.kts
          test -f app/build.gradle.kts
          chmod +x ./gradlew
          grep -q 'applicationId = "com.akiraa14200.eightaudio"' app/build.gradle.kts

      - name: Build arm64 debug APK
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleMobileArm64Debug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/mobile/arm64/debug/app-mobile-arm64-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::Expected APK was not produced: $APK"
            find app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 8-audio-arm64-debug
          path: app/build/outputs/apk/mobile/arm64/debug/*.apk
          if-no-files-found: error
          retention-days: 14
