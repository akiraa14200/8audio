name: Build 8 Audio APK (fixed)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 8 Audio build configuration
        uses: actions/checkout@v4
        with:
          path: config

      - name: Checkout ArchiveTune source
        uses: actions/checkout@v4
        with:
          repository: rukamori/ArchiveTune
          ref: main
          path: ArchiveTune

      - name: Verify Gradle wrapper location
        working-directory: ArchiveTune
        run: |
          test -f ./gradlew || { echo "::error::ArchiveTune checkout does not contain gradlew at its root"; find . -maxdepth 3 -name gradlew -print; exit 1; }
          chmod +x ./gradlew

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: ArchiveTune/gradle/libs.versions.toml

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build arm64 debug APK
        working-directory: ArchiveTune
        run: ./gradlew --no-daemon assembleArm64Debug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: 8-audio-arm64-debug
          path: ArchiveTune/**/build/outputs/apk/**/*arm64*debug*.apk
          if-no-files-found: error
          retention-days: 7
